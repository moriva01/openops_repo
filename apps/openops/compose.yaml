name: openops
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openops
      POSTGRES_USER: openops
      POSTGRES_PASSWORD: ${OPENOPS_DB_PASSWORD:?Run scripts/prepare_receiver.py first}
    volumes:
      - openops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openops -d openops"]
      interval: 5s
      timeout: 3s
      retries: 20
  receiver:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .local/zetaris.env
    environment:
      PGHOST: db
      PGDATABASE: openops
      PGUSER: openops
      PGPASSWORD: ${OPENOPS_DB_PASSWORD}
      OPENOPS_INGEST_TOKEN: ${OPENOPS_INGEST_TOKEN:?Missing ingestion credential}
      OPENOPS_READ_TOKEN: ${OPENOPS_READ_TOKEN:?Missing read credential}
      OPENOPS_HOST_ID: ${OPENOPS_HOST_ID:-tmc-lab-01}
      OPENOPS_ADMIN_TOKEN: ${OPENOPS_ADMIN_TOKEN}
      OPENOPS_ZETARIS_DB_PASSWORD: ${OPENOPS_ZETARIS_DB_PASSWORD}
    ports:
      - "${OPENOPS_BIND_IP:-192.168.1.17}:8096:8096"
    volumes:
      - openops-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  openops-data:
  openops-logs:
